{% extends "layout.html" %}
{% block title %}Create account · Streaklight{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Start growing something</h1>
        <p class="auth-sub">One account, as many habits as you want to keep.</p>
        <form method="post" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autofocus required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>

            <label for="confirmation">Confirm password</label>
            <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required>

            <button type="submit" class="btn btn-primary">Create account</button>
        </form>
        <p class="auth-switch">Already have one? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
